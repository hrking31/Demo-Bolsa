# Revisa, prueba y compila el proyecto en cada push a main y en cada pull request.
# No necesita la clave de API: las pruebas simulan Twelve Data y la compilación
# funciona sin ella.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar
        run: npm run build
